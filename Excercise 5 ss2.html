 <p><u>Bài 2:</u></p>
 <h1>Booking Form</h1>
    <form action="Hô rau gọi bún.com" method="get">
        <label for="name">Name:</label>
        <input type="text" id="name" name="name" ><br><br>

        <label for="email">Email:</label>
        <input type="email" id="email" name="email" ><br><br>

        <label for="phone">Phone:</label>
        <input type="tel" id="phone" name="phone" ><br><br>

        <label for="date">Date:</label>
        <input type="date" id="date" name="date" ><br><br>
    
        <label for="time">Time:</label>
        <input type="time" id="time" name="time" ><br><br>

        <label for="number of guest">Number of Guests:</label>
        <input type="number" id="number of guest" name="Number of Guest" min="1"><br><br>
    
        <input type="submit" value="Submit">
    </form>
<p><u>Bài 3:</u></p>
<form action="Hô rau gọi bún.com" method="post">
        <label for="name">Name:</label>
        <input type="text" id="name" name="name" ><br><br>

        <label for="email">Email:</label>
        <input type="email" id="email" name="email" ><br><br>

        <label for="phone">Phone:</label>
        <input type="tel" id="phone" name="phone" ><br><br>

        <label for="Choose a Car">Choose a Car:</label>
        <select name="Choose a Car" id="Choose a Car">
            <option value="Model 1">Model 1</option>
            <option value="Model 2">Model 2</option>
            <option value="Model 3">Model 3</option>
        </select><br><br>

        <label for="Choose a Color">Choose a Color:</label>
        <select name="Choose a Color" id="Choose a Color">
            <option value="Red">Red</option>
            <option value="Blue">Blue</option>
            <option value="Green">Green</option>
        </select><br><br>

        <label for="quantity">Quantity:</label>
        <input type="number" id="quantity" name="quantity" min="1"><br><br>

        <label for="delivery date">Delivery Date:</label>
        <input type="date" id="delivery date" name="Delivery Date"><br><br>

        <input type="submit" value="Submit">
    </form>
